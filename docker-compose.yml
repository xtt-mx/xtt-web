services:
  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
    image: ghcr.io/xtt-mx/xtt-web:latest
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
      # Los webhooks los lee el route handler en runtime. Antes faltaban: el
      # contenedor arrancaba sin ellos y `/api/contact` respondía 503 en
      # producción mientras en local funcionaba. Las de SMTP que estaban en su
      # lugar ya no las lee nadie desde que el envío se hace por n8n.
      N8N_CONTACT_WEBHOOK_URL: ${N8N_CONTACT_WEBHOOK_URL}
      N8N_WEBHOOK_SECRET: ${N8N_WEBHOOK_SECRET}
    # Sin `ports`: solo Caddy habla con este servicio, por la red interna.
    expose:
      - '3000'

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Persisten los certificados: sin esto, cada `up` vuelve a pedirlos y
      # Let's Encrypt aplica rate limit.
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

volumes:
  caddy_data:
  caddy_config:

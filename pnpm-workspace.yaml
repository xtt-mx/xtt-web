# Que `pnpm run` no vuelva a instalar por su cuenta.
#
# `verifyDepsBeforeRun` vale `install` por defecto: antes de ejecutar un script,
# pnpm comprueba si `node_modules` está al día y, si cree que no, lanza un
# install anidado. Eso ha roto el despliegue de Hostinger dos veces por motivos
# distintos: la primera, porque ese segundo install preguntaba «¿borro y rehago
# node_modules?» en una terminal sin nadie al otro lado; la segunda, porque el
# pnpm del servidor avanzó a 11.24 y el install anidado choca con el 11.4.0 que
# fija `packageManager` al correr bajo corepack.
#
# ⚠️ Esto vivía en `.npmrc` y NO HACÍA NADA. La documentación de pnpm es
# explícita: «Only auth and registry settings are read from .npmrc files. All
# other settings are configured in pnpm-workspace.yaml». El archivo se borra
# para que nadie vuelva a creer que ese ajuste está puesto.
#
# Desactivarlo es seguro aquí porque nadie ejecuta scripts sobre un
# `node_modules` a medias: en local se instala antes, en CI hay un paso propio
# de `pnpm install --frozen-lockfile`, y el pipeline de Hostinger instala antes
# de construir. La comprobación solo podía molestar.
verifyDepsBeforeRun: false

# pnpm no ejecuta postinstall scripts salvo que se aprueben aquí de forma explícita.
# Solo habilitamos los que realmente necesitan compilar un binario nativo.
allowBuilds:
  # Resolver nativo que usa eslint-import-resolver-typescript; sin build, el lint
  # cae a un resolver JS mucho más lento.
  unrs-resolver: true
  # No los usamos: Next 16 trae su propio SWC precompilado y no corremos watchers de Parcel.
  '@swc/core': false
  '@parcel/watcher': false
  # Lo arrastra Next 16.2 como dependencia (16.3 no lo hacía). No hace falta:
  # este sitio no usa `next/image` en ningún sitio, así que no hay ninguna
  # imagen que optimizar en servidor.
  sharp: false

# pnpm 11 aplica una cuarentena por antigüedad a paquetes nuevos. Estas son las
# versiones que fijamos deliberadamente, así que se excluyen.
#
# Van en 16.2 y NO en la última, a propósito: el binario nativo de SWC de la
# línea 16.3 exige glibc 2.30 y el servidor de Hostinger no llega a 2.29. Lo
# vigila `scripts/check-swc-glibc.mjs`.
minimumReleaseAgeExclude:
  - 'next@16.2.12'
  - 'eslint-config-next@16.2.12'
  - '@next/*'

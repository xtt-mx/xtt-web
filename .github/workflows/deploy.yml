name: Desplegar

# No se dispara con el push, sino cuando CI termina. Esa es la diferencia con
# el panel gestionado de Hostinger, que despliega lo que empujaste pase o no
# los tests: aquí un commit que rompa Playwright nunca llega al servidor.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

# Los despliegues se encolan; no se cancelan entre ellos. Cortar un
# `docker compose up --build` a media construcción deja el servidor en un
# estado que nadie sabe describir. Es lo contrario de lo que hace ci.yml, y la
# diferencia es deliberada: cancelar una validación no cuesta nada, cancelar un
# despliegue sí.
concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    name: VPS
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # `workflow_run` también se dispara con el CI de los pull requests y con las
    # corridas en rojo. Las tres condiciones hacen falta: sin la primera se
    # despliega lo que falló, sin las otras dos se despliega una rama cualquiera.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'

    # El entorno es lo que guarda los secretos de despliegue. En
    # Settings → Environments se le puede exigir aprobación manual sin tocar
    # este archivo.
    environment:
      name: produccion
      url: ${{ vars.DEPLOY_URL }}

    steps:
      - uses: actions/checkout@v7
        with:
          # El commit que CI validó. Por defecto `workflow_run` saca la punta de
          # la rama por omisión, que puede ir ya más adelantada.
          ref: ${{ github.event.workflow_run.head_sha }}

      # Sin esto, un repo recién clonado o sin configurar falla más adelante con
      # un error de ssh que no dice nada. El job tiene que salir en rojo —un
      # «salto silencioso» haría creer que desplegó— pero diciendo qué falta.
      - name: Comprobar la configuración
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_URL: ${{ vars.DEPLOY_URL }}
        run: |
          faltan=()
          for nombre in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS DEPLOY_URL; do
            [ -n "${!nombre:-}" ] || faltan+=("$nombre")
          done
          if [ ${#faltan[@]} -gt 0 ]; then
            echo "✗ falta configurar: ${faltan[*]}"
            echo "  Settings → Environments → produccion. Ver DEPLOY.md §2."
            exit 1
          fi
          echo "✓ configuración completa"

      - name: Preparar SSH
        env:
          CLAVE: ${{ secrets.DEPLOY_SSH_KEY }}
          ANFITRIONES_CONOCIDOS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$CLAVE" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # La alternativa a esto es `StrictHostKeyChecking=no`, que convierte
          # cualquier secuestro de DNS en un despliegue entregado al atacante
          # junto con la clave. El known_hosts se genera una vez con:
          #   ssh-keyscan -t ed25519 srv1827163.hstgr.cloud
          printf '%s\n' "$ANFITRIONES_CONOCIDOS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Desplegar
        env:
          DESTINO: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
          PUERTO: ${{ secrets.DEPLOY_PORT || 22 }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        # `BatchMode` hace que falle en vez de quedarse esperando una
        # contraseña que nadie va a escribir.
        run: |
          ssh -o BatchMode=yes -p "$PUERTO" "$DESTINO" \
            "DEPLOY_SHA=$SHA bash -s" < scripts/deploy-remote.sh

      - name: Comprobar que responde en público
        env:
          URL: ${{ vars.DEPLOY_URL }}
        # Un 401 cuenta como éxito y no es una concesión: en previsualización
        # Caddy pide contraseña para todo, `/api/health` incluido, así que un
        # 401 prueba justo lo que queremos saber —que hay TLS y que Caddy está
        # hablando con el contenedor—. Lo que no se acepta es un 502, que es lo
        # que sale si el contenedor no arrancó.
        #
        # Que el contenedor esté sano por dentro ya lo verificó el `--wait` del
        # script; esto comprueba el camino de fuera hacia dentro.
        run: |
          # El `|| true` evita que un fallo de conexión corte el paso antes de
          # imprimir el diagnóstico: curl deja un 000 y el `case` lo explica.
          codigo="$(curl --silent --show-error --location --max-time 20 \
            --output /dev/null --write-out '%{http_code}' "$URL/api/health" || true)"
          echo "$URL/api/health → $codigo"
          case "$codigo" in
            200 | 401) echo "✓ el sitio responde" ;;
            *) echo "✗ respuesta inesperada"; exit 1 ;;
          esac
